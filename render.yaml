services:
  - type: web
    name: sr-enterprises-crm-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @crm/web build
    startCommand: pnpm --filter @crm/api start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=256 --optimize-for-size
      - key: COOKIE_SAME_SITE
        value: none
      - key: SUPABASE_STORAGE_BUCKET
        value: crm-documents
      - key: USE_POSTGRES
        value: "true"
      - key: DB_MAX_CONNECTIONS
        value: "5"
